<title>Spellbound Arcade</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: a dotted play-mat; word setup on the left, game cabinet cards on the right; one stage card while playing. */
:root{
  --bg:#EAF5F0; --bg-dot:#D2EADF; --card:#FFFFFF; --ink:#1C2A36; --muted:#56666F; --line:#CADFD6;
  --tile:#FFD45E; --tile-edge:#D9A21E; --tile-ink:#3B2A00;
  --coral:#FF6A48; --coral-edge:#CF4A2C; --sky:#2F9BD0; --sky-edge:#1E7099;
  --grape:#7B5CD6; --leaf:#2EA866; --berry:#E2456A; --sun:#F4A51C;
  --good:#1F9E5A; --warn:#D88A0B; --bad:#D9384F;
  --sky-top:#BFE6F7; --sky-bot:#F2FBFF; --road:#46525D; --water:#8AD6F0; --water-deep:#43A9D9; --lily:#3FAE5A; --leaf-edge:#1E7A47; --dirt:#7A5638; --mole:#9C6B47;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1E27; --bg-dot:#17303C; --card:#1A2D38; --ink:#EAF3EF; --muted:#9FB3BB; --line:#2C4655;
    --sky-top:#123B52; --sky-bot:#1C3442; --road:#2B343D; --water:#1F6383; --water-deep:#123F56; --dirt:#4E3725; --mole:#A8774F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1E27; --bg-dot:#17303C; --card:#1A2D38; --ink:#EAF3EF; --muted:#9FB3BB; --line:#2C4655;
  --sky-top:#123B52; --sky-bot:#1C3442; --road:#2B343D; --water:#1F6383; --water-deep:#123F56; --dirt:#4E3725; --mole:#A8774F; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5;
  background-image:radial-gradient(var(--bg-dot) 2px, transparent 2.5px); background-size:22px 22px;
}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:clamp(16px,4vw,32px);padding-block:18px 56px}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.logo{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:none;border:0;padding:0;cursor:pointer}
.logo-tiles{display:flex;gap:4px;flex-wrap:wrap}
.logo-tiles span{
  width:clamp(26px,6.4vw,42px);aspect-ratio:1;display:grid;place-items:center;border-radius:8px;
  background:var(--tile);color:var(--tile-ink);box-shadow:0 4px 0 var(--tile-edge);
  font-family:var(--display);font-size:clamp(16px,4.2vw,27px);transition:transform .2s;
}
.logo-tiles span:nth-child(3n+1){transform:rotate(-5deg)}
.logo-tiles span:nth-child(3n+2){transform:rotate(3deg) translateY(2px)}
.logo-tiles span:nth-child(4n){transform:rotate(6deg)}
.logo:hover .logo-tiles span{transform:translateY(-3px) rotate(0)}
.logo-sub{font-family:var(--display);color:var(--coral);letter-spacing:.32em;font-size:15px;padding-left:2px}
.iconbtn{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:800;font-size:14px;display:flex;gap:8px;align-items:center}
.iconbtn svg{width:18px;height:18px}
/* generic */
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:clamp(16px,3vw,26px)}
h2{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;margin:0 0 6px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 14px}
label.lbl{display:block;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.btn{
  font-family:var(--display);font-size:18px;letter-spacing:.02em;border:0;border-radius:14px;cursor:pointer;
  padding:.55em 1.2em;background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral-edge);
  transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--coral-edge)}
.btn.blue{background:var(--sky);box-shadow:0 4px 0 var(--sky-edge)}
.btn.blue:active{box-shadow:0 1px 0 var(--sky-edge)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.small{font-size:15px;padding:.4em .9em}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* setup */
.setup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr);gap:22px;align-items:start}
@media (max-width:860px){.setup{grid-template-columns:minmax(0,1fr)}}
textarea#words{
  width:100%;min-height:200px;resize:vertical;border:2px solid var(--line);border-radius:14px;padding:12px 14px;
  background:var(--bg);font-size:17px;line-height:1.6;font-weight:600;
}
textarea#words:focus{border-color:var(--sky);outline:none}
.note{font-size:14px;color:var(--muted);margin:6px 0 0}
.note.sample{color:var(--warn);font-weight:800}
.note.err{color:var(--bad);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:112px;overflow:auto;margin-top:10px}
.chip{background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:1px 10px;font-weight:700;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stepper{display:flex;align-items:center;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.stepper button{width:44px;height:44px;border:0;background:none;font-size:24px;font-weight:800;cursor:pointer}
.stepper input{width:56px;height:44px;border:0;background:none;text-align:center;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.of{color:var(--muted);font-weight:700}
select#lang{border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg);font-weight:700}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.game{
  text-align:left;cursor:pointer;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:0;overflow:hidden;
  display:flex;flex-direction:column;transition:transform .15s, box-shadow .15s;box-shadow:0 5px 0 var(--line);
}
.game:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 9px 0 var(--line)}
.game:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.game .art{height:112px;display:grid;place-items:center;background:var(--c);position:relative;overflow:hidden}
.game .meta{padding:12px 16px 16px;display:flex;flex-direction:column;gap:2px}
.game .name{font-family:var(--display);font-size:21px;line-height:1.15}
.game .blurb{color:var(--muted);font-size:14.5px}
.game .best{margin-top:6px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.mini{display:flex;gap:5px}
.mini span{width:34px;height:34px;border-radius:7px;background:var(--tile);color:var(--tile-ink);display:grid;place-items:center;font-family:var(--display);font-size:20px;box-shadow:0 3px 0 var(--tile-edge)}
.mini span.dash{background:rgba(255,255,255,.35);box-shadow:none;border:2px dashed rgba(255,255,255,.9);color:transparent}
.game:hover .mini span:nth-child(odd){transform:rotate(-8deg)}
.game:hover .mini span:nth-child(even){transform:rotate(8deg) translateY(-3px)}
.mini span{transition:transform .2s}
.art svg{width:64px;height:64px}
.minib{display:flex;gap:10px;align-items:flex-end}
.minib i{display:block;width:34px;height:42px;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;background:var(--card);position:relative;font-style:normal;font-family:var(--display);color:var(--berry);text-align:center;line-height:42px;font-size:20px}
.minib i:nth-child(2){transform:translateY(-14px);color:var(--grape)}
.minigrid{display:grid;grid-template-columns:repeat(4,22px);gap:3px;transform:rotate(-4deg)}
.minigrid span{width:22px;height:22px;background:rgba(255,255,255,.85);border-radius:5px;display:grid;place-items:center;font-family:var(--display);font-size:13px;color:#2a3a40}
.minigrid span.hl{background:var(--tile)}
/* play */
.hud{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;margin-bottom:14px}
.hud-title{font-family:var(--display);font-size:22px}
.dots{display:flex;gap:5px;flex-wrap:wrap;flex:1 1 60px;min-width:0}
.dots i{width:14px;height:14px;border-radius:4px;background:var(--line);transition:background .2s, transform .2s}
.dots i.cur{background:var(--tile);transform:scale(1.25)}
.dots i.perfect{background:var(--good)} .dots i.tricky{background:var(--warn)} .dots i.missed{background:var(--bad)}
.stat{display:flex;flex-direction:column;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:2px 14px;min-width:76px}
.stat span{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat.hot b{color:var(--coral)}
.stagewrap{position:relative}
.stage{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:20px;text-align:center}
.prompt{font-family:var(--display);font-size:clamp(20px,3.6vw,26px);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:-12px 0 0;font-weight:600}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:100%}
.tile{
  width:clamp(40px,10vw,58px);aspect-ratio:1;display:grid;place-items:center;border-radius:11px;border:0;padding:0;
  background:var(--tile);color:var(--tile-ink);box-shadow:0 4px 0 var(--tile-edge);
  font-family:var(--display);font-size:clamp(22px,5.4vw,32px);text-transform:uppercase;user-select:none;
}
button.tile{cursor:pointer;transition:transform .1s}
button.tile:hover{transform:translateY(-3px)}
.tile.slot{background:transparent;box-shadow:none;border:3px dashed var(--line)}
.tile.ghost{visibility:hidden}
.tile.good{background:var(--good);color:#fff;box-shadow:0 4px 0 #13703F}
.tile.faded{opacity:.28;box-shadow:none;border:3px dashed var(--tile-edge);background:transparent;color:var(--ink)}
input.tile{background:var(--card);color:var(--ink);box-shadow:none;border:3px dashed var(--coral);text-align:center;outline:none;caret-color:var(--coral)}
input.tile:focus{border-style:solid;border-color:var(--sky);background:var(--bg)}
input.tile.bad{border:3px solid var(--bad);color:var(--bad)}
input.tile.good{border:0}
.gap{width:18px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.typebox{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%;max-width:520px}
.answer{
  flex:1 1 240px;min-width:0;font-family:var(--display);font-size:28px;text-align:center;letter-spacing:.06em;
  border:3px solid var(--line);border-radius:16px;padding:8px 14px;background:var(--bg);
}
.answer:focus{border-color:var(--sky);outline:none}
.answer.good{border-color:var(--good);color:var(--good)}
.hint{margin:0;color:var(--warn);font-weight:800}
.bigspeak{width:120px;height:120px;border-radius:50%;border:0;background:var(--sky);box-shadow:0 6px 0 var(--sky-edge);cursor:pointer;display:grid;place-items:center;color:#fff}
.bigspeak svg{width:56px;height:56px}
.bigspeak:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sky-edge)}
.bigspeak.talking{animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}
.timer{width:min(340px,80%);height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--coral);border-radius:99px}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
/* balloons */
.skybox{position:relative;width:100%;height:min(380px,55vh);min-height:280px;border-radius:18px;overflow:hidden;background:linear-gradient(var(--sky-top),var(--sky-bot));touch-action:manipulation}
.balloon{
  position:absolute;left:0;bottom:0;width:62px;height:76px;border:0;padding:0;cursor:pointer;background:none;will-change:transform;
}
.balloon .b{position:absolute;inset:0 0 6px;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;background:var(--bc);
  box-shadow:inset -8px -10px 0 rgba(0,0,0,.12), inset 8px 8px 0 rgba(255,255,255,.25);
  display:grid;place-items:center;font-family:var(--display);font-size:30px;color:#fff;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.balloon::after{content:"";position:absolute;left:50%;top:68px;width:2px;height:36px;background:var(--muted);opacity:.5}
.balloon.pop .b{animation:popb .25s forwards}
@keyframes popb{to{transform:scale(1.6);opacity:0}}
.balloon.no .b{animation:shake .4s}
/* word search */
.search{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;align-items:flex-start;width:100%}
.grid{
  display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;width:min(100%,540px);touch-action:none;user-select:none;
  background:var(--line);padding:6px;border-radius:16px;
}
.cell{aspect-ratio:1;display:grid;place-items:center;background:var(--card);border-radius:5px;font-family:var(--display);
  font-size:calc(min(100vw - 80px, 528px) / var(--n) * .52);text-transform:uppercase;cursor:pointer;transition:background .12s}
.cell.pv{background:var(--tile);color:var(--tile-ink)}
.cell.f0{background:color-mix(in srgb,var(--coral) 60%,var(--card))}
.cell.f1{background:color-mix(in srgb,var(--sky) 60%,var(--card))}
.cell.f2{background:color-mix(in srgb,var(--leaf) 60%,var(--card))}
.cell.f3{background:color-mix(in srgb,var(--grape) 55%,var(--card))}
.cell.f4{background:color-mix(in srgb,var(--sun) 65%,var(--card))}
.cell.f5{background:color-mix(in srgb,var(--berry) 55%,var(--card))}
.cell.reveal{outline:3px solid var(--bad);outline-offset:-3px}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;flex:0 1 200px;min-width:0;text-align:left}
.wlist li{font-weight:800;font-size:18px;padding:4px 12px;border-radius:10px;background:var(--bg);overflow-wrap:anywhere}
.wlist li.done{text-decoration:line-through;text-decoration-thickness:3px;color:var(--muted)}
/* burst */
.burst{position:absolute;left:0;right:0;top:24px;display:grid;place-items:center;pointer-events:none;z-index:5}
.burst div{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:14px 26px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.18);animation:burstin .35s cubic-bezier(.3,1.6,.5,1)}
.burst b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,44px);line-height:1.1}
.burst small{font-weight:800;color:var(--muted);font-size:16px}
.burst .w{font-family:var(--display);font-size:32px;color:var(--ink);letter-spacing:.05em}
.burst.perfect b{color:var(--good)} .burst.tricky b{color:var(--warn)} .burst.missed b{color:var(--bad);font-size:22px}
@keyframes burstin{from{transform:scale(.4) rotate(-6deg);opacity:0}}
/* results */
.results{max-width:680px;margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.stars{display:flex;gap:10px}
.stars svg{width:clamp(56px,14vw,84px);height:auto}
.stars svg path{fill:var(--line)}
.stars svg.on path{fill:var(--sun)}
.stars svg.on{animation:starin .5s cubic-bezier(.3,1.7,.5,1) both}
.stars svg:nth-child(2){animation-delay:.15s;transform:translateY(-10px)}
.stars svg:nth-child(3){animation-delay:.3s}
@keyframes starin{from{transform:scale(0) rotate(-40deg)}}
.bigscore{font-family:var(--display);font-size:clamp(48px,10vw,72px);line-height:1;font-variant-numeric:tabular-nums}
.summary{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-weight:800}
.summary span{padding:3px 12px;border-radius:999px;color:#fff}
.rlist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.rlist span{border:2px solid;border-radius:12px;padding:3px 12px;font-weight:800}
.rlist .perfect{border-color:var(--good);color:var(--good)}
.rlist .tricky{border-color:var(--warn);color:var(--warn)}
.rlist .missed{border-color:var(--bad);color:var(--bad)}
/* modes */
.modes{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.mode{flex:1 1 240px;text-align:left;cursor:pointer;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px 18px;display:flex;flex-direction:column;gap:2px;box-shadow:0 4px 0 var(--line);transition:transform .1s}
.mode b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.15}
.mode span{color:var(--muted);font-size:14.5px}
.mode:hover{transform:translateY(-2px)}
.mode[aria-pressed="true"]{border-color:var(--coral);box-shadow:0 4px 0 var(--coral-edge);background:color-mix(in srgb,var(--coral) 10%,var(--card))}
.mode[aria-pressed="true"] b{color:var(--coral)}
.btn.green{background:var(--leaf);box-shadow:0 4px 0 var(--leaf-edge)}
.btn.green:active{box-shadow:0 1px 0 var(--leaf-edge)}
.btn.big{font-size:22px;padding:.6em 1.4em}
/* definition games */
.defbox{font-size:clamp(19px,3vw,24px);font-weight:700;max-width:640px;background:var(--bg);border:2px dashed var(--line);border-radius:16px;padding:14px 20px;line-height:1.4;overflow-wrap:anywhere}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;width:100%;max-width:760px}
.opt{border:3px solid var(--line);background:var(--card);border-radius:16px;padding:12px 16px;font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 4px 0 var(--line);line-height:1.35;overflow-wrap:anywhere;transition:transform .1s}
.opt:hover{transform:translateY(-2px);border-color:var(--sky)}
.opt.word{font-family:var(--display);font-weight:400;font-size:25px;letter-spacing:.03em}
.opt.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 20%,var(--card))}
.opt.bad{border-color:var(--bad);opacity:.55;text-decoration:line-through}
.opt:disabled{cursor:default;transform:none}
.flip{width:min(420px,100%);aspect-ratio:3/2;perspective:1100px;cursor:pointer;border:0;background:none;padding:0}
.flip .inner,.mcard .inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .inner,.mcard.on .inner{transform:rotateY(180deg)}
.flip .face,.mcard .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:8px;overflow:auto}
.flip .front{background:var(--tile);color:var(--tile-ink);box-shadow:0 6px 0 var(--tile-edge)}
.flip .front b{font-family:var(--display);font-weight:400;font-size:clamp(34px,7vw,54px);line-height:1.05;overflow-wrap:anywhere}
.flip .back{background:var(--card);border:3px solid var(--sky);transform:rotateY(180deg);font-size:clamp(18px,3vw,24px);font-weight:700;line-height:1.4}
.flip .back p{margin:0}
.flip small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;opacity:.7}
.tapnote{font-weight:800;font-size:14px;opacity:.65}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;width:100%}
.mcard{aspect-ratio:4/3;perspective:800px;border:0;background:none;padding:0;cursor:pointer}
.mcard .face{border-radius:14px;padding:8px}
.mcard .cover{background:var(--grape);background-image:radial-gradient(rgba(255,255,255,.22) 2px,transparent 2.5px);background-size:12px 12px;color:#fff;font-family:var(--display);font-size:34px}
.mcard .show{transform:rotateY(180deg);background:var(--card);border:3px solid var(--line);font-weight:700;font-size:13.5px;line-height:1.3}
.mcard .show.w{background:var(--tile);color:var(--tile-ink);border:0;font-family:var(--display);font-weight:400;font-size:clamp(16px,4.4vw,21px);overflow-wrap:normal;word-break:keep-all}
.mcard.done .show{border:3px solid var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 35%,transparent)}
.mcard.reveal .show{border:3px solid var(--bad)}
.match{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 16px;width:100%;max-width:840px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.mi{border:3px solid var(--line);background:var(--card);border-radius:14px;padding:10px 14px;cursor:pointer;text-align:left;font-weight:700;font-size:15.5px;line-height:1.35;box-shadow:0 3px 0 var(--line);overflow-wrap:anywhere;min-height:52px}
.mi.w{font-family:var(--display);font-weight:400;font-size:clamp(16px,4.2vw,21px);text-align:center;overflow-wrap:normal;white-space:nowrap;padding-inline:12px;background:var(--tile);color:var(--tile-ink);border-color:var(--tile-edge);box-shadow:0 3px 0 var(--tile-edge)}
.mi.sel{outline:4px solid var(--sky);outline-offset:1px}
.mi:disabled{cursor:default}
.mi.m0{background:color-mix(in srgb,var(--coral) 30%,var(--card));border-color:var(--coral)}
.mi.m1{background:color-mix(in srgb,var(--sky) 30%,var(--card));border-color:var(--sky)}
.mi.m2{background:color-mix(in srgb,var(--leaf) 30%,var(--card));border-color:var(--leaf)}
.mi.m3{background:color-mix(in srgb,var(--grape) 30%,var(--card));border-color:var(--grape)}
.mi.m4{background:color-mix(in srgb,var(--sun) 35%,var(--card));border-color:var(--sun)}
.mi.w.matched{color:var(--ink);box-shadow:none}
.skybox.wide .balloon{width:var(--bw,140px);height:64px}
.skybox.wide .balloon .b{border-radius:40px;font-size:clamp(14px,2.3vw,19px);text-transform:none;padding:0 10px;line-height:1.1;overflow-wrap:anywhere;text-align:center}
.skybox.wide .balloon::after{top:58px}
/* whack-a-letter */
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,16px);width:min(440px,100%)}
.hole{position:relative;aspect-ratio:1;overflow:hidden}
.hole::before{content:"";position:absolute;left:4%;right:4%;bottom:2%;height:30%;border-radius:50%;background:var(--dirt)}
.hole::after{content:"";position:absolute;left:4%;right:4%;bottom:2%;height:15%;border-radius:0 0 50% 50%/0 0 100% 100%;background:var(--dirt);z-index:2;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.mole{position:absolute;left:16%;right:16%;bottom:8%;height:72%;z-index:1;border:0;padding:22% 0 0;cursor:pointer;border-radius:50% 50% 38% 38%;color:#fff;font-family:var(--display);font-size:clamp(24px,7vw,36px);text-transform:uppercase;transform:translateY(120%);transition:transform .18s ease-out,background .15s;background:radial-gradient(circle at 34% 24%,#1b1b1b 0 4px,transparent 5px),radial-gradient(circle at 66% 24%,#1b1b1b 0 4px,transparent 5px),var(--mole)}
.mole.up{transform:translateY(0)}
.mole.bonk{background:var(--good)}
.mole.no{background:var(--bad)}
/* snowman */
.snowman{width:min(170px,40vw);height:auto;transform-origin:50% 100%;transition:transform .4s}
.snowman g,.snowman path{transition:opacity .4s}
.lives{font-weight:800;color:var(--muted);margin:-10px 0 0}
.keys{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:640px}
.key{width:42px;height:46px;border-radius:10px;border:0;background:var(--tile);color:var(--tile-ink);font-family:var(--display);font-size:20px;box-shadow:0 3px 0 var(--tile-edge);cursor:pointer;text-transform:uppercase}
.key.hit{background:var(--good);color:#fff;box-shadow:none}
.key.miss{background:var(--line);color:var(--muted);box-shadow:none}
.key:disabled{cursor:default}
.tile.lost{background:var(--bad);color:#fff;box-shadow:none}
/* rocket */
.launch{position:relative;height:210px;width:min(360px,100%);border-radius:18px;overflow:hidden;background:linear-gradient(var(--sky-top),var(--sky-bot))}
.launch::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:var(--dirt)}
.rocket{position:absolute;left:50%;bottom:12px;width:58px;margin-left:-29px;transition:transform .25s}
.rocket svg{width:100%;height:auto;display:block}
.rocket.go{transition:transform .9s ease-in;transform:translateY(-420px)!important}
.answer.off{border-color:var(--bad);color:var(--bad)}
.tile.sm{width:clamp(30px,7vw,40px);font-size:clamp(17px,4vw,22px);border-radius:8px;box-shadow:0 3px 0 var(--tile-edge)}
.tile.sm.slot{box-shadow:none}
/* card art */
.minicards{position:relative;width:110px;height:70px}
.minicards span{position:absolute;width:76px;height:50px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-size:15px}
.minicards span:first-child{left:0;top:4px;background:var(--tile);color:var(--tile-ink);transform:rotate(-8deg);box-shadow:0 3px 0 var(--tile-edge)}
.minicards span:last-child{right:0;top:14px;background:#fff;color:#2a3a40;transform:rotate(7deg)}
.minipills{display:flex;flex-direction:column;gap:5px;align-items:center}
.minipills i{font-style:normal;background:rgba(255,255,255,.88);color:#2a3a40;border-radius:8px;padding:1px 14px;font-family:var(--display);font-size:14px}
.minipills i.on{background:var(--tile);color:var(--tile-ink);transform:scale(1.12)}
.minimem{display:grid;grid-template-columns:repeat(3,28px);gap:5px}
.minimem i{height:22px;border-radius:5px;background:rgba(255,255,255,.4);font-style:normal;font-family:var(--display);font-size:13px;display:grid;place-items:center;color:var(--tile-ink)}
.minimem i:not(:empty){background:var(--tile)}
.minib i.w{width:56px;border-radius:22px;font-size:14px}
/* game menu sections */
.ghead{font-family:var(--display);font-weight:400;font-size:20px;margin:22px 0 10px;display:flex;align-items:baseline;gap:10px}
.ghead span{font-family:var(--body);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#games .ghead:first-child{margin-top:4px}
.cluebadge{position:absolute;top:8px;right:8px;background:var(--card);color:var(--ink);font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:2px 9px;border-radius:999px}
/* letter catcher */
.field{position:relative;width:100%;height:min(380px,55vh);min-height:280px;border-radius:18px;overflow:hidden;background:linear-gradient(var(--sky-top),var(--sky-bot));touch-action:none;cursor:pointer;user-select:none}
.drop{position:absolute;left:0;top:0;width:50px;height:50px;border-radius:50%;background:var(--dc);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:26px;text-transform:uppercase;box-shadow:inset -5px -6px 0 rgba(0,0,0,.15);will-change:transform;pointer-events:none}
.basket{position:absolute;bottom:8px;left:0;width:96px;height:50px;pointer-events:none}
.basket svg{width:100%;height:100%;display:block}
/* lane racer */
.road{position:relative;width:min(360px,100%);height:min(400px,58vh);min-height:300px;border-radius:18px;overflow:hidden;background:var(--road);touch-action:manipulation;cursor:pointer;user-select:none}
.road .ll{position:absolute;top:-44px;bottom:0;width:4px;margin-left:-2px;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.7) 0 22px,transparent 22px 44px);animation:dash .45s linear infinite}
@keyframes dash{to{transform:translateY(44px)}}
.car{position:absolute;bottom:14px;left:0;width:56px;transition:left .15s ease-out;z-index:2}
.car svg{width:100%;height:auto;display:block}
.gaterow{position:absolute;left:0;right:0;top:0;display:flex;will-change:transform;z-index:1}
.gate{flex:1;display:grid;place-items:center}
.gate span{width:52px;height:52px;border-radius:12px;background:var(--tile);color:var(--tile-ink);box-shadow:0 4px 0 var(--tile-edge);display:grid;place-items:center;font-family:var(--display);font-size:28px;text-transform:uppercase}
.gate.good span{background:var(--good);color:#fff;box-shadow:none}
.gate.bad span{background:var(--bad);color:#fff;box-shadow:none}
/* frog hop and fishing */
.pond{position:relative;width:min(480px,100%);height:310px;border-radius:18px;overflow:hidden;background:linear-gradient(var(--water),var(--water-deep));user-select:none}
.pads{position:absolute;top:26px;left:0;right:0;display:flex;justify-content:space-around;padding:0 8px}
.pad{width:clamp(64px,18vw,84px);aspect-ratio:1;border-radius:50%;border:0;padding:0;background:var(--lily);color:#fff;font-family:var(--display);font-size:clamp(26px,7vw,34px);text-transform:uppercase;cursor:pointer;box-shadow:inset -6px -8px 0 rgba(0,0,0,.15);transition:transform .12s}
.pad:hover{transform:scale(1.07)}
.pad.no{background:var(--bad);opacity:.6;animation:shake .4s}
.homepad{position:absolute;left:50%;bottom:10px;width:120px;height:42px;margin-left:-60px;border-radius:50%;background:var(--lily);opacity:.85}
.frog{position:absolute;left:50%;bottom:22px;width:84px;margin-left:-42px;transition:transform .38s cubic-bezier(.3,1.4,.6,1);z-index:2;pointer-events:none}
.frog svg{width:100%;height:auto;display:block}
.frog.nojump{transition:none}
.pond.fishpond{width:100%;height:min(380px,55vh);min-height:280px}
.fish{position:absolute;left:0;top:0;width:86px;height:48px;border:0;padding:0;background:none;cursor:pointer;will-change:transform}
.fish .b{position:absolute;top:0;bottom:0;left:20px;right:0;border-radius:50% 45% 45% 50%;background:var(--bc);display:grid;place-items:center;font-family:var(--display);font-size:26px;color:#fff;text-transform:uppercase;box-shadow:inset -6px -6px 0 rgba(0,0,0,.14);text-shadow:0 2px 0 rgba(0,0,0,.18)}
.fish::before{content:"";position:absolute;left:0;top:8px;width:26px;height:32px;background:var(--bc);clip-path:polygon(0 0,100% 50%,0 100%)}
.fish::after{content:"";position:absolute;right:12px;top:12px;width:7px;height:7px;border-radius:50%;background:#1b1b1b}
.fish.l .b{left:0;right:20px;border-radius:45% 50% 50% 45%}
.fish.l::before{left:auto;right:0;clip-path:polygon(100% 0,0 50%,100% 100%)}
.fish.l::after{right:auto;left:12px}
.fish.pop .b{animation:popb .25s forwards}
.fish.pop::before,.fish.pop::after{opacity:0}
.fish.no .b{animation:shake .4s}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
<canvas id="confetti"></canvas>
<div class="wrap">
  <header class="top">
    <button class="logo" id="home" aria-label="Spellbound Arcade, back to the start">
      <span class="logo-tiles" aria-hidden="true"><span>S</span><span>P</span><span>E</span><span>L</span><span>L</span><span>B</span><span>O</span><span>U</span><span>N</span><span>D</span></span>
      <span class="logo-sub">ARCADE</span>
    </button>
    <button class="iconbtn" id="mute" aria-pressed="false" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path id="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
      <span id="mutelbl">Sound on</span>
    </button>
  </header>
  <!-- SETUP -->
  <div class="modes" id="modes" role="group" aria-label="What do you want to practise?">
    <button class="mode" type="button" data-mode="spell" aria-pressed="true"><b>Spellings</b><span>Practise spelling a list of words.</span></button>
    <button class="mode" type="button" data-mode="def" aria-pressed="false"><b>Spellings &amp; Definitions</b><span>Learn your words together with what they mean.</span></button>
  </div>
  <section id="setup" class="setup">
    <div class="card">
      <h2 id="wordsTitle">Your words</h2>
      <p class="lead" id="wordsLead">Type or paste your spelling list. Put each word on its own line, or separate them with commas.</p>
      <label class="lbl" for="words" id="wordsLbl">Spelling list</label>
      <textarea id="words" spellcheck="false" autocapitalize="off"></textarea>
      <p class="note sample" id="sampleNote" hidden>These are example words. Replace them with your own.</p>
      <p class="note sample" id="skipNote" hidden></p>
      <p class="note err" id="err" hidden>Add at least one word to start a game.</p>
      <div class="chips" id="chips" aria-label="Words in your list"></div>
      <label class="lbl" for="count">Words per round</label>
      <div class="row">
        <div class="stepper">
          <button type="button" id="minus" aria-label="Fewer words">−</button>
          <input type="number" id="count" min="1" value="10" inputmode="numeric">
          <button type="button" id="plus" aria-label="More words">+</button>
        </div>
        <span class="of" id="of">of 10</span>
        <button class="btn ghost small" type="button" id="all">Use all</button>
      </div>
      <label class="lbl" for="lang">Voice language</label>
      <select id="lang">
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="da-DK">Dansk</option>
        <option value="de-DE">Deutsch</option>
        <option value="es-ES">Español</option>
        <option value="fr-FR">Français</option>
        <option value="nl-NL">Nederlands</option>
        <option value="sv-SE">Svenska</option>
        <option value="nb-NO">Norsk</option>
      </select>
    </div>
    <div>
      <h2>Pick a game</h2>
      <p class="lead" id="gamesLead">Each round picks words at random from your list.</p>
      <div id="games"></div>
    </div>
  </section>
  <!-- PLAY -->
  <section id="play" hidden>
    <div class="hud">
      <button class="btn ghost small" id="quit" type="button">Quit</button>
      <div class="hud-title" id="gname"></div>
      <div class="dots" id="dots"></div>
      <div class="stat"><span>Score</span><b id="score">0</b></div>
      <div class="stat" id="streakbox"><span>Streak</span><b id="streak">0</b></div>
    </div>
    <div class="stagewrap">
      <div class="card stage" id="stage"></div>
      <div class="burst" id="burst" hidden></div>
    </div>
  </section>
  <!-- RESULTS -->
  <section id="results" hidden>
    <div class="card results" id="resbox"></div>
  </section>
</div>
<div id="oops" hidden style="position:fixed;left:16px;right:16px;bottom:16px;z-index:99;background:#D9384F;color:#fff;padding:12px 16px;border-radius:14px;font-weight:800"></div>
<script>window.addEventListener('error', e => { const o = document.getElementById('oops'); if(o){ o.hidden = false; o.textContent = 'Something went wrong: ' + (e.message || e); } });</script>
